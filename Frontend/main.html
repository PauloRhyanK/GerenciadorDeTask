    <!DOCTYPE html>
    <html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta http-equiv="X-UA-Compatible" content="IE=edge" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Todo Avançado</title>
        <link rel="stylesheet" href="css/style.css" />
        <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.1.2/css/all.min.css"
        integrity="sha512-1sCRPdkRXhBV2PBLUdRb4tMg1w2YPf37qatUFeS7zlBy7jJI8Lf4VHwWfZZfpXtYSLy85pkm9GaYVYMfw5BC1A=="
        crossorigin="anonymous"
        referrerpolicy="no-referrer"
        />

        <script src="js/scripts.js" defer></script>
    </head>
    <body>    
            <header>
                <h1>Lista de Tarefas</h1>
            </header>
            <div class="container">
                <div class="item v">
                    <label for="name">Nova Tarefa</label>
                    <input type="text" id="idName" name="name" placeholder="Insira nova tarefa">
                </div>
                <div class="item h margin-top">
                    <div class="v">
                        <label for="priority">Prioridade</label>
                        <select name="priority" id="idPriority">
                            <option value="longterm">Longo Prazo</option>
                            <option value="three months">3 Mêses</option>
                            <option value="moderate">Medio</option>
                            <option value="high">Alto</option>
                            <option value="urgent">Urgente</option>
                        </select>
                    </div>
                    <div class="v">
                        <label for="taskType">Tipo</label>                        
                        <select name="taskType" id="idTaskType">
                            <option value="career">Carreira</option>
                            <option value="university">Faculdade</option>
                            <option value="personal">Pessoal</option>
                            <option value="ministry">Ministério</option>
                        </select>
                    </div>
                </div>
                <div class="send">
                    <button id="btnAdd" class="btnAdd">
                        Adicionar
                    </button>
                </div>
            </div>
            <div class="container control">
                <div>
                    <div class="item v min-margin">
                        <label for="search">Pesquisar Tarefa</label>
                        <input type="text" placeholder="Nome da tarefa">
                    </div>
                    <div class="item filter min-margin">
                        <div>
                            <p>Filtrar</p>

                        </div>
                        <div class="options h">
                            <div class="v">
                                <label for="priority">Prioridade</label>
                                <select name="priority" id="idPriority">
                                    <option value="longterm">Longo Prazo</option>
                                    <option value="three months">3 Mêses</option>
                                    <option value="moderate">Medio</option>
                                    <option value="high">Alto</option>
                                    <option value="urgent">Urgente</option>
                                </select>
                            </div>
                            <div class="v">
                                <label for="taskType">Tipo</label>                        
                                <select name="taskType" id="idTaskType">
                                    <option value="career">Carreira</option>
                                    <option value="university">Faculdade</option>
                                    <option value="personal">Pessoal</option>
                                    <option value="ministry">Ministério</option>
                                </select>
                            </div>  
                            <div class="v">
                                <label for="taskType">Tempo</label>                        
                                <select name="taskType" id="idTaskType">
                                    <option value="career">Recentes</option>
                                    <option value="university">Antigas</option>
                                </select>
                            </div>  
                        </div>
                        
                    </div>
                    <div class="send">
                        <button>Buscar</button>

                    </div>
                    
                </div>
                <div class="task-list">
                    <ul>
                        <li>
                            <div class="task-top">
                                <h4>Titulo da tarefa</h4>
                                <div>
                                    <button>
                                        <svg xmlns="http://www.w3.org/2000/svg" width="25" height="20" fill="currentColor" class="bi bi-check-all" viewBox="0 0 16 16">
                                            <path d="M8.97 4.97a.75.75 0 0 1 1.07 1.05l-3.99 4.99a.75.75 0 0 1-1.08.02L2.324 8.384a.75.75 0 1 1 1.06-1.06l2.094 2.093L8.95 4.992zm-.92 5.14.92.92a.75.75 0 0 0 1.079-.02l3.992-4.99a.75.75 0 1 0-1.091-1.028L9.477 9.417l-.485-.486z"/>
                                        </svg>
                                    </button>
                                    <button>
                                        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="20" fill="currentColor" class="bi bi-pencil-fill" viewBox="0 0 16 16">
                                            <path d="M12.854.146a.5.5 0 0 0-.707 0L10.5 1.793 14.207 5.5l1.647-1.646a.5.5 0 0 0 0-.708zm.646 6.061L9.793 2.5 3.293 9H3.5a.5.5 0 0 1 .5.5v.5h.5a.5.5 0 0 1 .5.5v.5h.5a.5.5 0 0 1 .5.5v.5h.5a.5.5 0 0 1 .5.5v.207zm-7.468 7.468A.5.5 0 0 1 6 13.5V13h-.5a.5.5 0 0 1-.5-.5V12h-.5a.5.5 0 0 1-.5-.5V11h-.5a.5.5 0 0 1-.5-.5V10h-.5a.5.5 0 0 1-.175-.032l-.179.178a.5.5 0 0 0-.11.168l-2 5a.5.5 0 0 0 .65.65l5-2a.5.5 0 0 0 .168-.11z"/>
                                        </svg>
                                    </button>
                                </div>
                            </div>

                            <div class="task-info">
                                <div class="task-class">
                                    <p>prioridade</p>
                                    <p>Tipo</p>
                                </div>
                                <div class="time">
                                    Criada xx/xx/xx as xx:xx
                                </div>    
                            </div>
                        </li>
                    </ul>
                </div>
            </div>
